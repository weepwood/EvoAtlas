name: Validate EvoAtlas

on:
  push:
    branches: [main, "feat/**", "design/**"]
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check layout/engine.js
          node --check tests/layout-engine.test.cjs
          node --check ui/custom-select.js
          node --check data/data.js
          node --check data/curation.js
          node --check data/species.js
          node --check data/research.js
      - name: Pure layout engine geometry tests
        run: node --test tests/layout-engine.test.cjs
      - name: Curated data structure
        run: python3 scripts/validate_data.py
      - name: HTML and JavaScript element contracts
        run: python3 scripts/validate_ui.py
      - name: Research database directory metadata
        run: node scripts/validate_research.js
